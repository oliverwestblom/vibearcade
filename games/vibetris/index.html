<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vibetris · B3 Vibe</title><link rel="stylesheet" href="../../style.css"><script src="../common.js" defer></script><script src="../foto.js" defer></script><script src="game.js" defer></script></head><body><main class="game-shell"><a class="back-link" href="../../index.html">← Till huvudmenyn <kbd>Esc</kbd></a><header class="game-header"><p class="eyebrow">07 / PUSSEL</p><h1>Vibetris<span>.</span></h1><p>← → flyttar, ↑ roterar, Z bakåt, ↓ mjukdroppar, mellanslag droppar, C håller, P pausar.</p></header><div class="toolbar"><span class="stats">Poäng <span id="score">0</span> · Nivå <span id="level">1</span> · Rader <span id="lines">0</span></span><span class="name-field"><label for="player">Namn</label><input id="player" maxlength="12" placeholder="ANONYM" autocomplete="off" spellcheck="false"></span><button class="primary" id="start">Spela igen</button></div><canvas id="board" width="560" height="520" aria-label="Vibetris spelplan med håll-ruta, nästa bitar, poäng och topplista."></canvas><p id="status" role="status">Bygg rader. Mellanslag släpper, C håller, P pausar.</p><div class="touch-controls" aria-label="Styrning"><button class="control" data-tap="vanster" aria-label="Flytta vänster">←</button><button class="control" data-hold="ner" aria-label="Mjukdroppa">↓</button><button class="control" data-tap="hoger" aria-label="Flytta höger">→</button><button class="control" data-tap="rotera" aria-label="Rotera">↻</button><button class="control" data-tap="drop" aria-label="Hårddroppa">Droppa</button><button class="control" data-tap="hall" aria-label="Håll bit">Håll</button><button class="control foto-knapp" id="foto" type="button" title="Ta en bild när du slår rekord">Rekordfoto: av</button></div></main></body></html>
